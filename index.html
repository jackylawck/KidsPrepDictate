  <!-- 🌐 Open Graph (Facebook / LinkedIn / WhatsApp 社交卡片) -->
  <meta property="og:type" content="website" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="童温默書 KidsPrepDictate" />
  <meta name="twitter:description" content="香港小學專用中英文默書 PWA，支援離線發音與嚴格筆順驗證。" />

  <!-- 📱 PWA 與行動裝置「加入主畫面」設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="童温默書" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#b71c1c" />
  <meta name="application-name" content="童温默書" />
  
  <!-- 🍎 iOS 桌面圖示 (簡約風) -->
  <link rel="apple-touch-icon" href="/KidsPrepDictate192icon.png" />
  
  <!-- 🤖 Android/Chrome PWA 桌面安裝配置 -->
  <link rel="manifest" href="/manifest.json" />

  <!-- 🛡️ 企業級安全策略：Content Security Policy (CSP) 與權限隔離 -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' 'unsafe-eval';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: blob: https://jackylawck.github.io;
    font-src 'self' data:;
    connect-src 'self' data: ws: wss:;
    media-src 'self' data:;
    object-src 'none';
    base-uri 'self';
    form-action 'none';
  " />
  <!-- 默書 App 不需要取用鏡頭、麥克風與定位，直接全面封鎖提升資安評級 -->
  <meta http-equiv="Permissions-Policy" content="accelerometer=(), gyroscope=(), microphone=(), camera=(), geolocation=(), payment=()" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <header>
      <div class="top-bar">
        <h1 data-i18n="appTitle">童温默書</h1>
        <div class="header-actions">
          <span id="progress-pill" class="progress-pill" role="status" aria-live="polite">自由模式：已寫 0 字</span>
          <button type="button" id="btn-lang-toggle" class="btn-lang" data-i18n-aria-label="switchLang" aria-label="切換至英文介面">EN</button>
        </div>
      </div>
    </header>

    <details id="parent-panel" class="parent-panel">
      <summary data-i18n="parentSummary">📝 家長出題 / 切換模式（點擊展開）</summary>

      <div class="mode-group subject-toggle">
        <label><input type="radio" name="subject" value="zh" checked /> <span data-i18n="subjectZh">🇭🇰 中文默書</span></label>
        <label><input type="radio" name="subject" value="en" /> <span data-i18n="subjectEn">🇬🇧 英文默書</span></label>
      </div>

      <div class="mode-group">
        <button type="button" id="btn-free-mode" class="btn-secondary full-width" data-i18n="btnFreeMode">✍️ 切換至「無家長自由寫字模式」</button>
      </div>

      <div class="mode-group">
        <textarea id="input-passage" rows="3" data-i18n-placeholder="passagePlaceholder" placeholder="貼上默書課文（中文例：牀前明月光 / 英文例：apple, banana, ice cream）" aria-label="默書課文輸入框"></textarea>

        <div id="en-options-wrapper" class="en-options-box" style="display: none;">
          <label class="sys-kb-label">
            <input type="checkbox" id="use-sys-kb" />
            <span data-i18n="sysKbLabel">允許使用系統鍵盤（高小 / 藍牙鍵盤適用）</span>
          </label>
          <label class="sys-kb-label">
            <input type="checkbox" id="en-fuzzy-mode" />
            <span data-i18n="enFuzzyLabel">初小寬鬆容錯（差 1 個字母亦算過關並提醒）</span>
          </label>
          <div class="hint-level-row">
            <span data-i18n="enHintLevelLabel">英文提示強度：</span>
            <select id="en-hint-level" aria-label="英文提示強度">
              <option value="first" data-i18n="hintOptFirst">首字母（a _ _ _ _）</option>
              <option value="firstTwo" data-i18n="hintOptFirstTwo">前兩字母（a p _ _ _）</option>
              <option value="full" data-i18n="hintOptFull">完整單字（apple）</option>
            </select>
          </div>
        </div>

        <button type="button" id="btn-start-passage" class="btn-primary full-width" data-i18n="btnStartPassage">鎖定整段課文並開始默書</button>
      </div>
    </details>

    <div class="toolbar">
      <button type="button" id="btn-speak-sentence" class="btn-icon" data-i18n="btnSpeakSentence">🔊 朗讀段落</button>
      <button type="button" id="btn-speak-char" class="btn-icon" data-i18n="btnSpeakChar">🗣️ 讀出當前字</button>
      <button type="button" id="btn-slow-listen" class="btn-icon" style="display: none;" data-i18n="btnSlowListen">🐢 慢慢聽</button>
    </div>

    <div id="sentence-slots" class="sentence-slots" aria-live="polite"></div>
    <div id="feedback-banner" class="feedback-banner" role="alert" style="display: none;"></div>
    <div id="candidate-bar" class="candidate-bar" style="display: none;"></div>

    <div id="zh-workspace" class="workspace-container">
      <div class="canvas-container">
        <span id="stroke-badge" class="stroke-badge">自由寫字（已寫 0 劃）</span>
        <canvas id="trace-canvas" class="trace-canvas"></canvas>
        <canvas id="ink-canvas" class="ink-canvas"></canvas>
      </div>
    </div>

    <div id="en-workspace" class="workspace-container" style="display: none;">
      <input type="text" id="sys-en-input" class="sys-en-input" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off" />
      <div id="en-display" class="en-display" aria-live="polite"></div>
      <div id="en-keyboard" class="en-keyboard"></div>
    </div>

    <div class="action-bar">
      <button type="button" id="btn-confirm-word" class="btn-success" data-i18n="btnConfirm">✅ 確認寫完</button>
      <button type="button" id="btn-hint" class="btn-warning" data-i18n="btnHint">💡 偷睇筆順</button>
      <button type="button" id="btn-clear" class="btn-danger" data-i18n="btnClear">🧹 重寫本字</button>
      <button type="button" id="btn-skip" class="btn-secondary" data-i18n="btnSkip">⏭️ 唔識跳過</button>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>

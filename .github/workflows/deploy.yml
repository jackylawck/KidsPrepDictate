name: KidsPrepDictate CI/CD & Clean-Room Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  verify-and-build:
    name: 🛡️ 數據建置、型別檢查與乾淨室測試
    runs-on: ubuntu-latest

    steps:
      - name: 1. 檢出程式碼
        uses: actions/checkout@v4

      - name: 2. 安裝 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 3. 設定 Node.js 20 與套件快取
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'package.json'

      - name: 4. 安裝相依套件
        run: pnpm install --no-frozen-lockfile

      - name: 5. 編譯字典與三態治理數據管線
        run: |
          pnpm run compile:dict
          pnpm run build:data

      - name: 6. TypeScript 嚴格型別檢查 (行內獨立驗證)
        run: pnpm exec tsc --noEmit --target ES2022 --module ESNext --moduleResolution bundler --lib ES2022,DOM,DOM.Iterable --strict --skipLibCheck src/main.ts

      - name: 7. 執行自動化門禁測試
        run: pnpm exec vitest run

      - name: 8. 構建生產環境靜態檔案 (Vite Direct Build)
        run: pnpm exec vite build --base=/KidsPrepDictate/

      - name: 9. 上傳 GitHub Pages 構建產物
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy-pages:
    name: 🚀 部署至 GitHub Pages
    needs: verify-and-build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 部署網站
        id: deployment
        uses: actions/deploy-pages@v4

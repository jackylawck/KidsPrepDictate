name: KidsPrepDictate CI/CD & Clean-Room Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify-and-build:
    name: 🛡️ 數據建置、型別檢查與乾淨室測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - name: 安裝相依套件
        run: pnpm install --frozen-lockfile
      - name: 編譯字典與三態治理數據管線
        run: |
          pnpm run compile:dict
          pnpm run build:data
      - name: TypeScript 型別檢查
        run: pnpm run typecheck
      - name: 單元測試
        run: pnpm run test:run
      - name: 構建靜態檔案
        run: pnpm exec vite build
      - name: 上傳 GitHub Pages 產物
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
          retention-days: 1

  deploy-pages:
    name: 🚀 部署至 GitHub Pages
    needs: verify-and-build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
